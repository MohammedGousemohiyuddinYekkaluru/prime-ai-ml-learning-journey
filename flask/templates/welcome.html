<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome page</title>
</head>
<body>
    {{ header | safe}}
    <h1>Welcome back {{ name }}!</h1>

    {% if name %}
        <h1>Hello {{ name }}</h1>
    {% else %}
        <h1>Hello anonymous</h1>
    {% endif %}

    {% for friend in friends %}
        <ul>
            <li>{{ friend }}</li>
        </ul>
    {% endfor %}
</body>
</html>
